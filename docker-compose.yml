# One command builds everything and runs the whole flow:
#
#   docker compose up --build --abort-on-container-exit --exit-code-from harness
#
# Inside the harness container the order is: oracle check -> no-op check -> model run.

name: rl-env-template

services:
  sandbox:                       # where the agent's tools run
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    networks: [isolated]         # internal network only: no internet access
    init: true                   # forwards SIGTERM so the sandbox stops at once instead of being killed after 10s
    # The server runs as root but keeps only these three capabilities: SETUID/SETGID to drop
    # run_python to the unprivileged 'coder' user, KILL to terminate coder's leftovers on reset.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    environment:
      # Shared token for the harness-only control endpoints. Override with a real secret in .env.
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-rlenv-internal-control}
      CAND_TMP: /home/coder/cand-tmp       # candidate temp/home (coder-owned), wiped on reset, outside the workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  verifier:                      # runs the hidden checks; only the harness can reach it
    build:
      context: .
      dockerfile: Dockerfile.verifier
    networks: [verify]           # its own internal network: no internet, no route from the sandbox
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  harness:                       # expected answers, reward, baselines and the model loop
    build:
      context: .
      dockerfile: Dockerfile.harness
    depends_on:
      sandbox:
        condition: service_healthy
      verifier:
        condition: service_healthy
    networks: [isolated, verify, internet]   # can reach the sandbox, the verifier and the model API
    environment:
      MODEL: ${MODEL:-mock/solver}
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      MAX_TOKENS: ${MAX_TOKENS:-}
      TASK_ID: ${TASK_ID:-slugify}
      SEED: ${SEED:-0}
      MODE: ${MODE:-full}
      APPEND_FILE: ${APPEND_FILE:-}
      SANDBOX_URL: http://sandbox:8000
      VERIFIER_URL: http://verifier:8000
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-rlenv-internal-control}   # must match the sandbox
    volumes:
      - ./logs:/app/logs
      - ./inputs:/app/inputs:ro

networks:
  isolated:
    internal: true               # no route to the internet
  verify:
    internal: true               # harness <-> verifier only
  internet: {}
